# Phase 2a: claim queued retrain_jobs and run --write-draft.
# App only inserts the job row — no worker HTTP / PAT.

name: Retrain draft worker

on:
  schedule:
    # ~every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  process-queued-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: retrain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: retrain/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Claim job and write draft
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python run_queued_job.py
